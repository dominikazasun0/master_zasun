[project]
name = "antenna-measurement-app"
version = "0.1.0"
description = "Antenna Measurement Chamber Software"
authors = [
    {name = "Kacper Marks",email = "k.marks@microamp-solutions.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psutil (==7.0.0)",
    "pyserial (==3.5)",
    "pyside6 (==6.9.0)",
    "pyside6 (==6.9.0)",
    "pyside6-addons (==6.9.0)",
    "pyside6-essentials (==6.9.0)",
    "pyvisa (==1.15.0)",
    "matplotlib (==3.10.5)",
    "numpy (==2.3.2)",
    "pyopengl (==3.1.9)",
    "pyopengl (==3.1.9)",
    "pyqt6 (==6.9.0)",
    "pyqt6-sip (==13.10.2)",
    "pyqtgraph (==0.13.7)",
    "pytic (==0.0.4)",
    "pyyaml (==6.0.2)",
    "pythonqwt (>=0.14.5,<0.15.0)",
    "scipy (>=1.16.1,<2.0.0)",
    "xarm (>=0.0.4,<0.0.5)",
    "xarm-python-sdk (>=1.17.0,<2.0.0)",
    "h5py (>=3.15.1,<4.0.0)",
    "opencv-python (>=4.13.0.90,<5.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
